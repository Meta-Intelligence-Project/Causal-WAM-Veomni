# Data-only stage 1. Paths below are examples; supply local subset roots/statistics.
sampling: sample_uniform  # or source_weighted; source weights only affect that mode
seed: 42
train_steps: 1000
grad_accum_iter: 2  # microbatches per rank before one optimizer update
token_budget: 96000
buffer_size: 8  # minimum candidates before packing, not a byte/memory limit
num_workers: 4
prefetch_factor: 2
geometry:
  actions_per_block: 32
  video_stride: 4
  temporal_compression: 4
  spatial_compression: 16
  patch_size: 2
candidates:
  mode: frame_window # segmented
  max_actions: 160
  start_stride: 1
  overlap: 0
  use_subtask: true
  borrow_subtask_frames: false
sample:
  mode: joint
  mode_weights: [1, 1, 1]  # forward_dynamics, inverse_dynamics, policy
  full_history: true
  history_range: [1, 32]
sources:
  - name: agibot
    weight: 1
    roots: [/path/to/agibot/task_*/canonical_55d]
    statistics: '{root}/meta/causal_action_stats.json'
    columns:
      state: state_unified
      target: state_unified
      state_mask: mask_state
      target_mask: mask_state
      target_offset: 1
    resolution: "256"  # default; also supports "480"
    viewpoint: concat_view
    read:
      decode_threads: 0  # default: automatic decoder threads; 1 forces single-thread decoding
    cameras:
      head: observation.images.head
      left: observation.images.hand_left
      right: observation.images.hand_right
  - name: robotwin
    weight: 1
    roots: [/path/to/robotwin/RoboTwin__*/clean]
    statistics: '{root}/meta/causal_action_stats.json'
    resolution: "256"
    viewpoint: concat_view
    read:
      decode_threads: 0
    cameras:
      head: observation.images.cam_high
      left: observation.images.cam_left_wrist
      right: observation.images.cam_right_wrist
# Stage 2: candidates.mode=segmented, max_actions=1792, overlap=321,
# borrow_subtask_frames=true; sample.full_history=false, history_range=[1,32].
# Recheck token_budget for the actual camera layout and final tokenized prompt:
# long stage-2 samples can exceed 96000 and form standalone packs without truncation.
