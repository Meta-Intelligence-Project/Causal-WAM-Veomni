# Optional online-aligned fine-tuning: clean history + one joint future decision.
# Keep history_steps/action_horizon equal to the deployed service. P counts raw action ticks.
# Referenced window contract: Long-WAM CodeDenoise; native Cosmos model/noise/loss are retained.
stage: action
sampling: sample_uniform
validation:
  split_ratio: 0.05
  max_episodes_per_source: 100
  seed: 73
geometry:
  actions_per_block: 32
  video_stride: 4
  temporal_compression: 4
  spatial_compression: 16
  patch_size: 2
candidates:
  mode: frame_window
  max_actions: 32
  start_stride: 1
  overlap: 0
  use_subtask: true
sample:
  mode: joint
  mode_weights: [1, 1, 1]  # forward_dynamics, inverse_dynamics, policy; same task sampling as main.
  layout_mode: decision_window
  history_steps: 1024
  action_horizon: 32
  full_history: true
sources:
- name: agibot
  weight: 1
  roots:
  - /path/to/agibot/task_*/canonical_55d
  statistics: '{root}/meta/causal_action_stats.json'
  columns:
    state: state_unified
    target: state_unified
    state_mask: mask_state
    target_mask: mask_state
    target_offset: 1
  resolution: '256'
  viewpoint: concat_view
  read:
    decode_threads: 0
  cameras:
    head: observation.images.head
    left: observation.images.hand_left
    right: observation.images.hand_right
- name: robotwin
  weight: 1
  roots:
  - /path/to/robotwin/RoboTwin__*/clean
  statistics: '{root}/meta/causal_action_stats.json'
  resolution: '256'
  viewpoint: concat_view
  read:
    decode_threads: 0
  cameras:
    head: observation.images.cam_high
    left: observation.images.cam_left_wrist
    right: observation.images.cam_right_wrist
