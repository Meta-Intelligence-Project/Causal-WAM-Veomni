# Source mixture and validation split; experiment settings live in configs/dit/.
sampling: sample_uniform  # or source_weighted; source weights only affect that mode
validation:
  split_ratio: 0.05  # held-out episode fraction per source; train uses the complement
  max_episodes_per_source: 100  # cap each source after pooling all its roots
  seed: 73
sources:
  - name: agibot
    weight: 1
    roots: [/path/to/agibot/task_*/canonical_55d]
    statistics: '{root}/meta/causal_action_stats.json'
    columns:
      state: state_unified
      target: state_unified
      state_mask: mask_state
      target_mask: mask_state
      target_offset: 1
    resolution: "256"  # default; also supports "480"
    viewpoint: concat_view
    read:
      decode_threads: 2  # Bound decoder threads across workers and training ranks.
    cameras:
      head: observation.images.head
      left: observation.images.hand_left
      right: observation.images.hand_right
  - name: robotwin
    weight: 1
    roots: [/path/to/robotwin/RoboTwin__*/clean]
    statistics: '{root}/meta/causal_action_stats.json'
    resolution: "256"
    viewpoint: concat_view
    read:
      decode_threads: 2
    cameras:
      head: observation.images.cam_high
      left: observation.images.cam_left_wrist
      right: observation.images.cam_right_wrist
