# Source mixture and validation split; experiment parameters live in configs/dit/.
# sources[].cameras is optional: omit it to select head/left/right from meta/info.json.
# roots accepts directories/globs or JSON episode manifests, e.g. [/path/to/selected.json].
# JSON records contain lerobot_path and episodes; omit source/read.episodes when using JSON.
sampling: sample_uniform  # or source_weighted; source weights only affect that mode
validation:
  split_ratio: 0.05  # held-out episode fraction per source; train uses the complement
  max_episodes_per_source: 100  # cap each source after pooling all its roots
  seed: 73
sources:
  - name: agibot
    weight: 1
    roots:
      - /path/to/agibot.json
    statistics: '/path/to/causal_action_stats.json'
    columns:
      state: state_unified
      target: state_unified
      state_mask: mask_state
      target_mask: mask_state
      target_offset: 1
    resolution: "256"  # default; also supports "480"
    viewpoint: concat_view
    read:
      decode_threads: 0  # default: automatic decoder threads; 1 forces single-thread decoding
    cameras:
      head: observation.images.head
      left: observation.images.hand_left
      right: observation.images.hand_right
  - name: robotwin
    dataset_type: robotwin
    text_augmentation: false  # true: sample from meta/instruction_candidates.jsonl during training
    weight: 1
    roots:
      - /path/to/RoboTwin__*/clean
      - /path/to/RoboTwin__*/randomized
    statistics: '/path/to/causal_action_stats.json'
    resolution: "256"
    viewpoint: concat_view
    read:
      decode_threads: 0
    # cameras omitted: head/left/right are selected from meta/info.json.
    # Set cameras explicitly to override automatic selection.
