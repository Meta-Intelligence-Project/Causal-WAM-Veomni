# Complete trained triple-expert checkpoint required. Policy is intentionally unsupported.
expert_layout: triple
default_task: inverse_dynamics
device: npu:0
dtype: bfloat16
attention_backend: npu_tnd
ops_implementation:
  attn_implementation: eager
  rotary_pos_emb_implementation: torch_npu
  rms_norm_implementation: torch_npu
tokenizer: /mnt/sfs_turbo/public/ckpts/Cosmos/Cosmos3-Edge
vae: /mnt/sfs_turbo/public/ckpts/Wan-AI/Wan2.2-TI2V-5B-Diffusers/vae
statistics: /mnt/sfs_turbo/zheng/cosmos-ascend-profile/cosmos-framework-1030_poc/examples/action_posttrain/group_causal_action_stats.json
base_fps: 24.0
temporal_modality_margin: 15000
geometry:
  actions_per_block: 32
  video_stride: 4
  temporal_compression: 4
  spatial_compression: 16
  patch_size: 2
source:
  name: 1030_poc
  resolution: '256'
  viewpoint: concat_view
  npz_robot: piper
  cameras:
    head: observation.images.cam_high
    left: observation.images.cam_left_wrist
    right: observation.images.cam_right_wrist
  npz_cameras:
    head: cam_high
    left: cam_left_wrist
    right: cam_right_wrist
  columns:
    state: action_unified
    target: action_unified
    state_mask: mask_action
    target_mask: mask_action
    target_offset: 1
sampling:
  fdm_conditioning: both
  history: 32
  video_steps: 20
  action_steps: 20
  partial_video_steps: 4
  video_stop_sigma: 0.9  # sigma=1 is noise; sigma=0 is data. This future stays noisy.
  shift: 1.0
  guidance: 1.0
  guidance_interval: null
  normalize_cfg: false
  seed: 42
  negative_prompt: ''
