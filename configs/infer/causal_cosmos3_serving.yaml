# Native online inference. Resource paths, history, H/S/R, RTC and graphs are CLI options.
# Optional NPU capture: --npu-replay-graph --no-enable-rtc --cache-mode full --guidance 1
# Graphs require --attention-backend npu_tnd; RTC uses the eager gradient path.
# Match the operations used by the checkpoint's training recipe.
ops_implementation:
  attn_implementation: eager
  rotary_pos_emb_implementation: torch_npu
  rms_norm_implementation: torch_npu
sampling:
  shift: 1.0
  guidance_interval: null
  normalize_cfg: false
  # null inherits a matching distilled checkpoint's config; otherwise use UniPC.
  fixed_step_sampler_config: null
