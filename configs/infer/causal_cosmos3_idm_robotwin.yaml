# RoboTwin IDM inference; accepts the native global_step_4000 DCP directory directly.
device: npu:0
dtype: bfloat16
attention_backend: npu_tnd
# Match the training recipe, including BF16 rounding behavior.
ops_implementation:
  attn_implementation: eager
  rotary_pos_emb_implementation: torch_npu
  rms_norm_implementation: torch_npu
tokenizer: /mnt/sfs_turbo/public/ckpts/Cosmos/Cosmos3-Edge
vae: /mnt/sfs_turbo/public/ckpts/Wan-AI/Wan2.2-TI2V-5B-Diffusers/vae
statistics: /mnt/sfs_turbo/zheng/Veomni-Wam/datasets_statistics/robotwin/robotwin_all_statistics_minmax.json
base_fps: 24.0
temporal_modality_margin: 15000
geometry:
  actions_per_block: 32
  video_stride: 4
  temporal_compression: 4
  spatial_compression: 16
  patch_size: 2
source:
  name: robotwin
  resolution: '256'
  viewpoint: concat_view
  cameras:
    head: observation.images.cam_high
    left: observation.images.cam_left_wrist
    right: observation.images.cam_right_wrist
  npz_cameras:
    head: cam_high
    left: cam_left_wrist
    right: cam_right_wrist
  columns:
    state: state_unified
    target: action_unified
    state_mask: mask_state
    target_mask: mask_action
    target_offset: 0
  # RoboTwin commands use the same physical channels as the next observed state.
  rollout_state: action_as_state
sampling:
  use_kv_cache: false  # Reuse fixed KV within passes and verified context across blocks.
  history: 64
  steps: 20
  shift: 1.0
  guidance: 1.0
  guidance_interval: null  # Strict bounds in model time 0..1000; e.g. [200, 800].
  normalize_cfg: false
  # null inherits a distilled checkpoint's config, otherwise uses UniPC.
  # Example: {t_list: [0.999, 0.75, 0.5, 0.25], sample_type: sde}
  fixed_step_sampler_config: null # DMD2蒸馏后的预留参数
  seed: 42
  negative_prompt: ''
