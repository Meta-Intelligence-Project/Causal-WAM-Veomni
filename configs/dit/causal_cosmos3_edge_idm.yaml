# RoboTwin IDM with this branch's measured-history decision windows and TBPTT.
# Launch with scripts/causal_cosmos3/training_scripts/train_idm_robotwin.sh.
# This differs from the full-episode/auxiliary-video IDM reference worktree.
model:
  model_path: /mnt/sfs_turbo/public/ckpts/Cosmos/Cosmos3-Edge
  config_path: configs/model_configs/causal_cosmos3/causal_cosmos3_edge.json
  condition_model_path: configs/model_configs/causal_cosmos3/condition.json
  model_config:
    action_interface: shared
    action_dim: 55
    state_dim: 55
    train_generation_only: true
    enable_tbptt: true
    # Raw control steps per differentiable segment, not the retained-history length.
    # Must be a multiple of 16 and, for H32 Action training, a multiple of 32.
    tbptt_segment_steps: 256
    # Native IDM supervises actions; future video is a clean condition with no video loss.
    video_loss_weight: 1.0
    action_loss_weight: 1.0
    weight_loading:
      skip_patterns: ["audio_*", "action_*"]
  condition_model_cfg:
    attention_backend: npu_tnd
    vae_reset_prefix_cache_mb: 4096
  ops_implementation:
    attn_implementation: eager
    rotary_pos_emb_implementation: torch_npu
    rms_norm_implementation: torch_npu
  optimizer:
    type: adamw
    lr: 5.0e-5
    lr_start: 1.0e-5
    betas: [0.9, 0.99]
    eps: 1.0e-8
    weight_decay: 0.05
    max_grad_norm: 1.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.1
  accelerator:
    dp_shard_size: 8  # 4 x 8 devices: four replica groups, each sharded over eight devices.
    init_device: meta
    gradient_checkpointing:
      enable: true
      recompute_layers: -1
      selective_recompute_layers: 28
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
data:
  train_path: configs/data/action_robotwin.yaml
  stage: action
  geometry:
    actions_per_block: 32
    video_stride: 4
    temporal_compression: 4
    spatial_compression: 16
    patch_size: 2
  candidates:
    start_stride: 1
    use_subtask: false
  sample:
    mode: inverse_dynamics
    history_steps: 1024
    action_horizon: 32
  # Only independent-window packing uses this budget; TBPTT reads ordered segments.
  max_seq_len: 54000
  dyn_bsz_buffer_size: 8
  log_sample: false
  dataloader:
    type: native
    num_workers: 4
    worker_num_threads: 1
    prefetch_factor: 2
    pin_memory: false
    use_background_prefetcher: true
train:
  training_task: online_training
  micro_batch_size: 2  # Two independent episode lanes in one packed forward per device.
  grad_accum_iter: 1
  max_steps: 10000  # Global optimizer updates; not one complete dataset traversal.
  num_train_epochs: 1
  dyn_bsz_runtime: main
  bsz_warmup_ratio: 0
  seed: 42
  gc_steps: 0
  eval_steps: 0
  checkpoint:
    manager: dcp
    output_dir: outputs/causal_cosmos3_idm_robotwin_tbptt
    save_steps: 2000
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: true
