# Run from the VeOmni root; replace checkpoint and source paths for your host.
model:
  model_path: /path/to/Cosmos3-Edge
  config_path: configs/model_configs/causal_cosmos3/causal_cosmos3_edge.json
  condition_model_path: configs/model_configs/causal_cosmos3/condition.json
  model_config:
    action_interface: shared
    action_dim: 55
    state_dim: 55
    train_generation_only: true
    video_loss_weight: 10.0
    action_loss_weight: 10.0
    action_time_weight: bsmntw  # All supervised action targets; video retains uniform weights.
    weight_loading:
      skip_patterns: ["audio_*", "action_*"]
  condition_model_cfg:
    attention_backend: npu_tnd
    # ID action only; null distribution inherits video. FD/Policy keep shared times.
    action_time_sampler: uniform  # e.g. uniform
    action_shift: 5.0
  ops_implementation:
    attn_implementation: eager
    rotary_pos_emb_implementation: torch_npu
    rms_norm_implementation: torch_npu
  optimizer:
    type: adamw
    lr: 5.0e-5
    lr_start: 1.0e-5
    betas: [0.9, 0.99]
    eps: 1.0e-8
    weight_decay: 0.05
    max_grad_norm: 1.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.1
  accelerator:
    dp_shard_size: 8  # 每个 HSDP 分片组的卡数；复制组数自动推导为 dp_size / dp_shard_size。
    init_device: meta
    gradient_checkpointing:
      enable: true
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
data:
  train_path: configs/data/action_datasets.yaml
  # The source YAML owns sampling, validation and sources; this recipe owns sample construction.
  stage: action
  geometry:
    actions_per_block: 32
    video_stride: 4
    temporal_compression: 4
    spatial_compression: 16
    patch_size: 2
  candidates:
    mode: frame_window  # or segmented
    max_actions: 160
    start_stride: 1
    overlap: 0
    use_subtask: true
  sample:
    mode: joint
    mode_weights: [1, 1, 1]  # forward_dynamics, inverse_dynamics, policy
    full_history: true
    history_range: [1, 32]
  # Long-window alternative: data.candidates.mode=segmented, max_actions=1792, overlap=321;
  # data.sample.full_history=false, history_range=[1,32]. Recheck data.max_seq_len below.
  # Short windows pad their tails; padding is not supervision.
  # Token budget per pack; oversized individual samples form standalone packs without truncation.
  max_seq_len: 54000
  dyn_bsz_buffer_size: 8
  log_sample: false
  dataloader:
    type: native
    num_workers: 8
    pin_memory: false
    use_background_prefetcher: true
train:
  training_task: online_training
  micro_batch_size: 1
  grad_accum_iter: 2
  max_steps: 10000
  num_train_epochs: 1
  dyn_bsz_runtime: main
  bsz_warmup_ratio: 0
  seed: 42
  eval_steps: 1000
  checkpoint:
    manager: dcp
    output_dir: outputs/causal_cosmos3_edge
    save_steps: 1000
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: true
