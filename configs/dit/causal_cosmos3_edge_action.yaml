# Action training: independent windows by default, ordered episode segments with TBPTT.
# P/H are configured in data.sample below; TBPTT uses the same raw action/control steps.
# Run from the VeOmni root; replace checkpoint and source paths for your host.
model:
  model_path: /path/to/Cosmos3-Edge
  config_path: configs/model_configs/causal_cosmos3/causal_cosmos3_edge.json
  condition_model_path: configs/model_configs/causal_cosmos3/condition.json
  model_config:
    action_interface: shared
    action_dim: 55
    state_dim: 55
    train_generation_only: true
    enable_tbptt: false  # Opt in to continuous episode segments and detached boundary memory.
    # 每个TBPTT训练段最多推进的原始动作/控制步数；文本边界或episode尾部可提前结束。
    # 输入历史长度由本配方data.sample.history_steps控制，此参数不限制可见历史。
    # 必须为正整数且为16的倍数；默认每次预测32步，因此Action还需为32的倍数。
    # 256步 = 每段最多8个预测窗口，内部跨度为16个latent。
    tbptt_segment_steps: 256
    video_loss_weight: 10.0
    action_loss_weight: 10.0
    weight_loading:
      skip_patterns: ["audio_*", "action_*"]
  condition_model_cfg:
    attention_backend: npu_tnd
    vae_reset_prefix_cache_mb: 4096  # Per-rank retained reset-prefix snapshots; 0 disables.
  ops_implementation:
    attn_implementation: eager
    rotary_pos_emb_implementation: torch_npu
    rms_norm_implementation: torch_npu
  optimizer:
    type: adamw
    lr: 5.0e-5
    lr_start: 1.0e-5
    betas: [0.9, 0.99]
    eps: 1.0e-8
    weight_decay: 0.05
    max_grad_norm: 1.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.1
  accelerator:
    dp_shard_size: 8  # 每个 HSDP 分片组的卡数；复制组数自动推导为 dp_size / dp_shard_size。
    init_device: meta
    gradient_checkpointing:
      enable: true
      recompute_layers: -1
      selective_recompute_layers: 28  # Save attention outputs; recompute other operators.
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
data:
  train_path: configs/data/action_datasets.yaml
  # This recipe owns sample construction; the source YAML owns sources, sampling and validation.
  stage: action
  geometry:
    actions_per_block: 32
    video_stride: 4
    temporal_compression: 4
    spatial_compression: 16
    patch_size: 2
  candidates:
    start_stride: 1
    use_subtask: true
  sample:
    mode: joint
    mode_weights: [1, 1, 1]  # forward_dynamics, inverse_dynamics, policy
    history_steps: 1024
    action_horizon: 32
  # Episode-reset padding supplies unavailable history; future tail padding is not supervision.
  # Recheck data.max_seq_len in the training recipe for the camera layout and prompt.
  # Oversized individual samples form standalone packs without truncation.
  # The source YAML's validation.split_ratio partitions complete episode lists.
  max_seq_len: 54000  # Greedy budget for independent windows; never splits an episode segment.
  dyn_bsz_buffer_size: 8  # Independent-window packing only; episode segments remain FIFO.
  log_sample: false
  dataloader:
    type: native
    num_workers: 4  # Per rank; each decoder uses two threads in the source YAML.
    worker_num_threads: 1  # Bound Torch's intra-op pool inside each worker.
    prefetch_factor: 2
    pin_memory: false
    use_background_prefetcher: true
train:
  training_task: online_training
  # Action TBPTT: B independent episode segments share one packed forward.
  # B>1 requires at least B active worker lanes per rank. Other paths require1.
  # B2/accum1 keeps the segment count/update of B1/accum2; batching can change lane order.
  # NPU B>1 requires CLOSE_MATMUL_K_SHIFT=1 before starting Python.
  # train_action.sh exports 1 by default; direct torchrun must export it explicitly.
  # This controls the verified Matmul numerical setting; BF16 gradients are not bitwise guaranteed.
  micro_batch_size: 1
  grad_accum_iter: 2  # Sequential microbatches/rank/update, not simultaneous episode streams.
  max_steps: 10000
  num_train_epochs: 1
  dyn_bsz_runtime: main
  bsz_warmup_ratio: 0
  seed: 42
  gc_steps: 0  # Keep automatic collection for per-window Python/decoder cycles.
  eval_steps: 1000
  checkpoint:
    manager: dcp
    output_dir: outputs/causal_cosmos3_edge
    save_steps: 1000
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: true
