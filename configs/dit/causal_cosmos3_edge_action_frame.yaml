# Frame-sampling recipe; native training and full-history validation reuse existing runtimes.
# Uses the existing model/runtime settings; replace checkpoint and source paths for your host.
model:
  model_path: /path/to/Cosmos3-Edge
  config_path: configs/model_configs/causal_cosmos3/causal_cosmos3_edge.json
  condition_model_path: configs/model_configs/causal_cosmos3/condition.json
  model_config:
    action_interface: shared
    action_dim: 55
    state_dim: 55
    train_generation_only: true
    video_loss_weight: 10.0
    action_loss_weight: 10.0
    weight_loading:
      skip_patterns: ["audio_*", "action_*"]
  condition_model_cfg:
    attention_backend: npu_tnd
  ops_implementation:
    attn_implementation: eager
    rotary_pos_emb_implementation: torch_npu
    rms_norm_implementation: torch_npu
  optimizer:
    type: adamw
    lr: 5.0e-5
    lr_start: 1.0e-5
    betas: [0.9, 0.99]
    eps: 1.0e-8
    weight_decay: 0.05
    max_grad_norm: 1.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.1
  accelerator:
    dp_shard_size: 8  # 每个 HSDP 分片组的卡数；复制组数自动推导为 dp_size / dp_shard_size。
    init_device: meta
    gradient_checkpointing:
      enable: true
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
data:
  train_path: configs/data/frame_datasets.yaml
  # The source YAML owns sampling, validation and sources; this recipe owns sample construction.
  stage: action
  geometry:
    actions_per_block: 32
    video_stride: 4
    temporal_compression: 4
    spatial_compression: 16
    patch_size: 2
  candidates:
    mode: frame_anchor
    max_blocks: 4  # 相当于每次取 max_blocks * actions_per_block帧
    anchor_stride: 1 # 每条episode按照stride来采样
  sample:
    mode: policy
    full_history: true
    subtask_mode: subtask_concat  # choices: task, subtask_concat, subtask_single.
  # Full windows: 33 video frames, 128 actions and 4 block states.
  # Shorter windows retain only real complete blocks; training skips failed anchors in order.
  # Fixed samples per pack; max_seq_len and dyn_bsz_buffer_size are ignored when set.
  samples_per_pack: 8
  max_seq_len: -1
  dyn_bsz_buffer_size: 8
  log_sample: false
  dataloader:
    type: native
    num_workers: 8
    pin_memory: false
    use_background_prefetcher: true
train:
  training_task: online_training
  micro_batch_size: 1
  grad_accum_iter: 1
  max_steps: null  # Consume the complete candidate epoch, with the tail repeated to a full update.
  num_train_epochs: 5
  dyn_bsz_runtime: main
  bsz_warmup_ratio: 0
  seed: 42
  eval_steps: 0
  eval_epochs: 1
  checkpoint:
    manager: dcp
    output_dir: outputs/causal_cosmos3_edge_frame
    save_steps: 0
    save_epochs: 1
    save_hf_weights: true # false
  wandb:
    enable: true
