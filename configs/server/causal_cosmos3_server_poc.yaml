# Trained native/HF or DCP checkpoint supplied with --checkpoint.
# Save the matching trained config.json inside the checkpoint directory for both DCP and HF weights.
device: npu:0
task: policy  # inverse_dynamics: video prediction followed by action inference
dtype: bfloat16
attention_backend: npu_tnd
# Match configs/dit/causal_cosmos3_edge_action.yaml, including BF16 rounding behavior.
ops_implementation:
  attn_implementation: eager
  rotary_pos_emb_implementation: torch_npu
  rms_norm_implementation: torch_npu
tokenizer: /mnt/sfs_turbo/public/ckpts/Cosmos/Cosmos3-Edge/text_tokenizer
vae: /mnt/sfs_turbo/public/ckpts/Cosmos/Cosmos3-Edge/vae
statistics: /mnt/sfs_turbo/zheng/cosmos-ascend-profile/cosmos-framework-1030_poc/examples/action_posttrain/group_causal_action_stats.json
# Actual action/control FPS after dataset alignment, before video subsampling.
fps: 30.0
base_fps: 24.0
temporal_modality_margin: 15000
geometry:
  actions_per_block: 32
  video_stride: 4
  temporal_compression: 4
  spatial_compression: 16
  patch_size: 2
source:
  name: 1030_poc
  resolution: '256'
  viewpoint: concat_view
  npz_robot: piper
  cameras:
    head: observation.images.cam_high
    left: observation.images.cam_left_wrist
    right: observation.images.cam_right_wrist
  npz_cameras:
    head: cam_high
    left: cam_left_wrist
    right: cam_right_wrist
  columns:
    state: action_unified
    target: action_unified
    state_mask: mask_action
    target_mask: mask_action
    target_offset: 1
sampling:
  observation_mode: streaming  # Independent of kv_cache; window re-encodes the input window.
  kv_cache: true  # Session-owned text/video KV persists across real feedback requests.
  npu_graph: true  # CLI: --npu-graph / --no-npu-graph; Policy/streaming/npu_tnd only. First shape use captures graphs.
  history: 32
  steps: 10
  residual_reuse_full_steps: [0, 1, 6, 8]  # Zero-based decoder refresh steps; null disables reuse.
  shift: 1.0
  guidance: 1.0
  guidance_interval: null
  normalize_cfg: false
  fixed_step_sampler_config: null
  seed: 42
  negative_prompt: ''
