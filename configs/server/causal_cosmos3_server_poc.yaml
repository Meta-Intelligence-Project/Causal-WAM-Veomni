# Local 1104-command-32delta serving configuration migrated from:
# /home/agilex/cobot_magic/collect_data/cosmos_inference_config.json
# /home/agilex/cobot_magic/logs/cosmos/server.log
# Supply --checkpoint ckpts/1104-command-32delta separately.
# Client motion/smoothing settings and the request prompt are not server YAML fields.
device: cuda:0
task: policy  # inverse_dynamics: video prediction followed by action inference
dtype: bfloat16
attention_backend: grouped
# Portable CUDA ops; BF16 rounding can differ from the Ascend training kernels.
ops_implementation:
  attn_implementation: eager
  rotary_pos_emb_implementation: eager
  rms_norm_implementation: eager
tokenizer: /home/agilex/models/causal-cosmos/ckpts/shared_assets/Cosmos3-Edge/text_tokenizer
# Official Wan-AI/Wan2.2-TI2V-5B-Diffusers VAE, downloaded and hash-verified locally.
vae: ckpts/Wan2.2-TI2V-5B-Diffusers/vae
statistics: ckpts/1104-command-32delta/mixed-1103-command_block32_minmax_stats.json
# Actual action/control FPS after dataset alignment, before video subsampling.
fps: 30.0
base_fps: 24.0
temporal_modality_margin: 15000
geometry:
  actions_per_block: 32
  video_stride: 4
  temporal_compression: 4
  spatial_compression: 16
  patch_size: 2
source:
  name: 1104-command-32delta
  resolution: '480'
  viewpoint: concat_view
  npz_robot: piper
  cameras:
    head: observation.images.cam_high
    left: observation.images.cam_left_wrist
    right: observation.images.cam_right_wrist
  npz_cameras:
    head: cam_high
    left: cam_left_wrist
    right: cam_right_wrist
  columns:
    state: state_unified
    target: action_unified
    state_mask: mask_state
    target_mask: mask_state
    target_offset: 0
sampling:
  observation_mode: streaming  # Independent of kv_cache; window re-encodes the input window.
  kv_cache: true  # Session-owned text/video KV persists across real feedback requests.
  npu_graph: false  # Ascend-only graph replay is unavailable on CUDA.
  history: 32
  steps: 10
  residual_reuse_full_steps: [0, 1, 6, 8]  # Zero-based decoder refresh steps; null disables reuse.
  shift: 5.0
  guidance: 1.0
  guidance_interval: null
  normalize_cfg: false
  fixed_step_sampler_config: null
  seed: 42
  negative_prompt: ''
async_infer:
  rtc_enabled: true
  rtc_delay: 16  # Old-plan action steps executed after submitting the next request.
